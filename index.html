<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>MBBP 2026 Portal</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
    }

    /* The box around the table: scrolls if the table is too big */
    .table-box {
      overflow: auto;
      max-height: 80vh;
      border: 1px solid #ccc;
    }

    table {
      border-collapse: collapse;
      font-size: 13px;
    }

    th, td {
      border: 1px solid #ddd;
      padding: 6px 8px;
      white-space: nowrap;
    }

    /* Header row: dark blue, stays at the top when you scroll */
    th {
      background: #1f4e79;
      color: white;
      position: sticky;
      top: 0;
    }

    /* Every second row light grey (easier to read) */
    tr:nth-child(even) {
      background: #f5f5f5;
    }
  </style>
</head>

<body>
  <h1>MBBP 2026 Demand List</h1>
  <p>Total items: {{ demands|length }}</p>

  <div class="table-box">
    <table>
      <thead>
        <tr>
          {% for column in columns %}
            <th>{{ column }}</th>
          {% endfor %}
        </tr>
      </thead>

      <tbody>
        {% for row in demands %}
          <tr>
            {% for column in columns %}
              <td>{{ row[column] }}</td>
            {% endfor %}
          </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</body>
</html>
