<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>MBBP 2026 Portal</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

  <!-- ===== Top bar ===== -->
  <header class="top-bar">
    <h1>MBBP 2026 Demand Portal</h1>
    <span class="subtitle">Demand list from MBBP26_Apr_V1.xlsx</span>
  </header>

  <main>

    <!-- ===== KPI cards (filled by app.js) ===== -->
    <section class="kpi-row">
      <div class="kpi-card">
        <div class="kpi-label">Items</div>
        <div class="kpi-value" id="kpi-items">-</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">Total effort (man-days)</div>
        <div class="kpi-value" id="kpi-effort">-</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">Must to Have</div>
        <div class="kpi-value" id="kpi-must">-</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">MS/MT package possible</div>
        <div class="kpi-value" id="kpi-package">-</div>
      </div>
    </section>

    <!-- ===== Filters ===== -->
    <section class="filter-bar">
      <input type="text" id="search-box" placeholder="Search requirement, JIRA, topic..." oninput="showPage()">

      <select id="filter-io-lead" onchange="showPage()"></select>
      <select id="filter-e4-manager" onchange="showPage()"></select>
      <select id="filter-tech-module" onchange="showPage()"></select>
      <select id="filter-confirmation" onchange="showPage()"></select>

      <button onclick="clearFilters()">Clear filters</button>
    </section>

    <!-- ===== Table ===== -->
    <section class="table-card">
      <div class="table-info" id="table-info">Loading...</div>
      <div class="table-box">
        <table>
          <thead id="table-head"></thead>
          <tbody id="table-body"></tbody>
        </table>
      </div>
    </section>

  </main>

  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
