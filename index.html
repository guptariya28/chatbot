<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Finance Assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#ffffff;
    --bg-soft:#f7f7fc;
    --bg-hover:#f0eefb;
    --border:#e6e4f0;
    --text:#1d1b2e;
    --text-muted:#6b6880;
    --text-faint:#9997ab;
    --accent:#6c5ce7;
    --accent-dark:#5a49d6;
    --accent-soft:#efebff;
    --accent-soft-2:#e3ddff;
    --danger:#e6533c;
    --radius-lg:18px;
    --radius-md:12px;
    --radius-sm:8px;
    --shadow:0 8px 24px rgba(31,26,74,0.07);
    --shadow-sm:0 2px 8px rgba(31,26,74,0.06);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    font-family:'Inter',system-ui,sans-serif;
    color:var(--text);
    background:var(--bg);
    -webkit-font-smoothing:antialiased;
  }
  #app{
    height:100vh;
    height:100dvh;
    display:flex;
    flex-direction:column;
    overflow:hidden;
  }

  /* ---------- Topbar ---------- */
  .topbar{
    flex:0 0 auto;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:14px 28px;
    border-bottom:1px solid var(--border);
    background:var(--bg);
    z-index:20;
  }
  .brand{
    display:flex;
    align-items:center;
    gap:10px;
    font-family:'Sora',sans-serif;
    font-weight:600;
    font-size:18px;
    letter-spacing:-0.01em;
  }
  .brand-mark{
    width:30px;height:30px;border-radius:9px;
    background:linear-gradient(135deg,var(--accent),#9b8bff);
    display:flex;align-items:center;justify-content:center;
    color:#fff;flex:0 0 auto;
  }
  .brand-mark svg{width:16px;height:16px;}
  .hero-icon{
    width:64px;height:64px;border-radius:18px;margin:0 auto 22px;
    background:linear-gradient(135deg,var(--accent),#9b8bff);
    display:flex;align-items:center;justify-content:center;
    color:#fff;box-shadow:var(--shadow);
  }
  .hero-icon svg{width:30px;height:30px;}
  .topbar-actions{display:flex;align-items:center;gap:8px;}
  .btn-ghost{
    display:flex;align-items:center;gap:6px;
    background:transparent;border:1px solid var(--border);
    color:var(--text-muted);font-family:inherit;font-size:13.5px;font-weight:500;
    padding:8px 14px;border-radius:999px;cursor:pointer;
    transition:background .15s ease,border-color .15s ease,color .15s ease;
  }
  .btn-ghost:hover{background:var(--bg-soft);border-color:#d8d5ea;color:var(--text);}
  .btn-ghost svg{width:15px;height:15px;}

  /* ---------- Landing ---------- */
  #landing{
    flex:1 1 auto;
    overflow-y:auto;
    display:flex;
    justify-content:center;
  }
  .landing-inner{
    width:100%;
    max-width:960px;
    padding:64px 32px 48px;
    text-align:center;
  }
  .landing-inner h1{
    font-family:'Sora',sans-serif;
    font-size:34px;
    line-height:1.25;
    font-weight:600;
    margin:0 0 10px;
    letter-spacing:-0.015em;
  }
  .landing-inner p.sub{
    color:var(--text-muted);
    font-size:16px;
    margin:0 0 40px;
  }
  .cat-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
    gap:14px;
    text-align:left;
  }
  .cat-card{
    background:var(--bg);
    border:1px solid var(--border);
    border-radius:var(--radius-lg);
    padding:20px;
    cursor:pointer;
    transition:border-color .15s ease,transform .12s ease,box-shadow .15s ease;
    display:flex;
    flex-direction:column;
    gap:14px;
  }
  .cat-card:hover{border-color:var(--accent);box-shadow:var(--shadow-sm);transform:translateY(-2px);}
  .cat-badge{
    width:38px;height:38px;border-radius:10px;
    background:var(--accent-soft);color:var(--accent-dark);
    display:flex;align-items:center;justify-content:center;
    font-family:'Sora',sans-serif;font-weight:600;font-size:15px;
  }
  .cat-name{font-weight:600;font-size:15px;color:var(--text);}
  .cat-count{font-size:12.5px;color:var(--text-faint);}
  .landing-loading, .landing-empty{color:var(--text-faint);font-size:14px;padding:40px 0;}

  /* free-form starter */
  .landing-ask{
    margin-top:40px;
    display:flex;
    justify-content:center;
  }
  .landing-ask form{
    width:100%;
    max-width:560px;
    display:flex;
    align-items:center;
    gap:8px;
    background:var(--bg-soft);
    border:1px solid var(--border);
    border-radius:999px;
    padding:6px 6px 6px 18px;
  }
  .landing-ask input{
    flex:1;border:none;background:transparent;outline:none;
    font-family:inherit;font-size:14.5px;color:var(--text);
  }
  .landing-ask button{
    background:var(--accent);color:#fff;border:none;
    border-radius:999px;padding:10px 18px;font-family:inherit;
    font-size:13.5px;font-weight:600;cursor:pointer;
  }

  /* ---------- Chat view ---------- */
  #chatView{
    flex:1 1 auto;
    display:flex;
    flex-direction:column;
    overflow:hidden;
  }
  #chatView[hidden], #landing[hidden]{display:none !important;}

  /* Suggested questions panel */
  #questionsPanel{
    flex:0 0 auto;
    border-bottom:1px solid var(--border);
    background:var(--bg-soft);
    padding:14px 28px;
    display:flex;
    flex-direction:column;
    gap:10px;
    max-height:220px;
  }
  #questionsPanel[hidden]{display:none;}
  .qp-head{
    display:flex;align-items:center;justify-content:space-between;
  }
  .qp-title{
    font-size:12.5px;font-weight:600;color:var(--text-muted);
    text-transform:none;
  }
  .qp-close{
    background:none;border:none;cursor:pointer;color:var(--text-faint);
    padding:4px;border-radius:6px;line-height:0;
  }
  .qp-close:hover{color:var(--text);background:var(--bg-hover);}
  .qp-list{
    display:flex;flex-wrap:wrap;gap:8px;overflow-y:auto;
  }
  .qp-chip{
    background:var(--bg);
    border:1px solid var(--border);
    border-radius:999px;
    padding:8px 14px;
    font-size:13px;
    color:var(--text);
    cursor:pointer;
    transition:border-color .15s ease,background .15s ease;
    white-space:nowrap;
  }
  .qp-chip:hover{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-dark);}

  /* Messages */
  #messages{
    flex:1 1 auto;
    overflow-y:auto;
    padding:28px 0 16px;
  }
  .messages-inner{
    width:100%;
    margin:0;
    padding:0 40px;
    display:flex;
    flex-direction:column;
    gap:22px;
  }
  .msg-row{display:flex;gap:12px;}
  .msg-row.user{justify-content:flex-end;}
  .avatar{
    width:30px;height:30px;border-radius:9px;flex:0 0 auto;
    display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg,var(--accent),#9b8bff);
    color:#fff;
  }
  .avatar svg{width:15px;height:15px;}
  .bubble-col{display:flex;flex-direction:column;gap:8px;max-width:68%;}
  .msg-row.user .bubble-col{align-items:flex-end;}
  .msg-name-row{
    display:flex;align-items:baseline;gap:8px;padding:0 2px;
  }
  .msg-name-row .msg-name{font-size:13px;font-weight:600;color:var(--text);}
  .msg-name-row .msg-time{font-size:12px;color:var(--text-faint);}
  .bubble{
    padding:12px 16px;
    border-radius:var(--radius-md);
    font-size:14.5px;
    line-height:1.55;
    white-space:pre-wrap;
    word-wrap:break-word;
  }
  .msg-row.user .bubble{
    background:var(--accent);color:#fff;border-bottom-right-radius:4px;
  }
  .msg-row.ai .bubble{
    background:var(--bg-soft);color:var(--text);border:1px solid var(--border);
    border-bottom-left-radius:4px;
  }
  .msg-meta{
    font-size:11.5px;color:var(--text-faint);padding:0 2px;
  }
  .sources-row{display:flex;flex-wrap:wrap;gap:6px;padding:0 2px;}
  .source-chip{
    display:inline-flex;align-items:center;gap:5px;
    font-size:12px;color:var(--accent-dark);background:var(--accent-soft);
    border:1px solid var(--accent-soft-2);border-radius:999px;
    padding:4px 10px;text-decoration:none;
    transition:background .15s ease;
  }
  .source-chip:hover{background:var(--accent-soft-2);}
  .source-chip svg{width:11px;height:11px;}

  .feedback-row{display:flex;align-items:center;gap:4px;padding:0 2px;}
  .fb-btn{
    background:none;border:none;cursor:pointer;color:var(--text-faint);
    padding:5px;border-radius:7px;display:flex;align-items:center;justify-content:center;
    transition:background .15s ease,color .15s ease;
  }
  .fb-btn svg{width:15px;height:15px;}
  .fb-btn:hover{background:var(--bg-hover);color:var(--text);}
  .fb-btn.active-up{color:#1f9d55;background:#e9f8ee;}
  .fb-btn.active-down{color:var(--danger);background:#fdece8;}
  .fb-btn[disabled]{cursor:default;}
  .fb-note{font-size:12px;color:var(--text-faint);}

  .fb-comment-box{
    display:flex;gap:6px;margin-top:2px;
  }
  .fb-comment-box textarea{
    flex:1;resize:none;border:1px solid var(--border);border-radius:var(--radius-sm);
    padding:8px 10px;font-family:inherit;font-size:13px;min-height:36px;outline:none;
  }
  .fb-comment-box textarea:focus{border-color:var(--accent);}
  .fb-comment-box button{
    background:var(--accent);color:#fff;border:none;border-radius:var(--radius-sm);
    padding:0 14px;font-size:12.5px;font-weight:600;cursor:pointer;
  }

  .typing{display:flex;gap:4px;align-items:center;padding:4px 2px;}
  .typing span{
    width:6px;height:6px;border-radius:50%;background:var(--text-faint);
    animation:blink 1.2s infinite ease-in-out;
  }
  .typing span:nth-child(2){animation-delay:.2s;}
  .typing span:nth-child(3){animation-delay:.4s;}
  @keyframes blink{0%,80%,100%{opacity:.25;}40%{opacity:1;}}

  .empty-state{
    width:100%;margin:40px 0 0;padding:0 40px;text-align:center;
    color:var(--text-faint);font-size:14px;
  }

  /* Composer */
  #composer-wrap{
    flex:0 0 auto;
    border-top:1px solid var(--border);
    background:var(--bg);
    padding:16px 40px 20px;
  }
  .composer-inner{
    width:100%;margin:0;position:relative;
  }
  #suggestions{
    position:absolute;
    bottom:calc(100% + 8px);
    left:0;right:0;
    background:var(--bg);
    border:1px solid var(--border);
    border-radius:var(--radius-md);
    box-shadow:var(--shadow);
    overflow:hidden;
    max-height:260px;
    overflow-y:auto;
    z-index:30;
  }
  #suggestions[hidden]{display:none;}
  .sugg-item{
    display:flex;align-items:center;gap:10px;
    padding:11px 16px;
    font-size:13.5px;
    color:var(--text);
    cursor:pointer;
  }
  .sugg-item svg{width:14px;height:14px;color:var(--text-faint);flex:0 0 auto;}
  .sugg-item:hover, .sugg-item.active{background:var(--bg-soft);}
  .sugg-item span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

  .composer-box{
    display:flex;align-items:flex-end;gap:10px;
    border:1px solid var(--border);
    border-radius:var(--radius-lg);
    padding:10px 10px 10px 18px;
    background:var(--bg);
    transition:border-color .15s ease,box-shadow .15s ease;
  }
  .composer-box:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}
  #chatInput{
    flex:1;border:none;outline:none;resize:none;
    font-family:inherit;font-size:14.5px;line-height:1.5;
    max-height:140px;padding:6px 0;background:transparent;color:var(--text);
  }
  #sendBtn{
    flex:0 0 auto;
    width:36px;height:36px;border-radius:50%;
    background:var(--accent);border:none;color:#fff;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    transition:background .15s ease,transform .1s ease;
  }
  #sendBtn:hover{background:var(--accent-dark);}
  #sendBtn:active{transform:scale(.94);}
  #sendBtn:disabled{background:#d7d3ec;cursor:default;}
  #sendBtn svg{width:16px;height:16px;}
  .composer-hint{
    text-align:center;font-size:11.5px;color:var(--text-faint);margin-top:10px;
  }

  ::-webkit-scrollbar{width:8px;height:8px;}
  ::-webkit-scrollbar-thumb{background:#e2e0ee;border-radius:8px;}
  ::-webkit-scrollbar-thumb:hover{background:#cfccdf;}

  @media (max-width:640px){
    .topbar{padding:12px 16px;}
    .landing-inner{padding:40px 18px 32px;}
    .landing-inner h1{font-size:26px;}
    #questionsPanel{padding:12px 16px;}
    .messages-inner{padding:0 16px;}
    #composer-wrap{padding:12px 16px 16px;}
    .bubble-col{max-width:88%;}
  }
</style>
</head>
<body>
<div id="app">

  <header class="topbar">
    <div class="brand">
      <div class="brand-mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="8" width="16" height="12" rx="3"/><path d="M12 8V4"/><circle cx="12" cy="3" r="1" fill="currentColor"/><circle cx="9" cy="14" r="1.3" fill="currentColor"/><circle cx="15" cy="14" r="1.3" fill="currentColor"/><path d="M2 13h2M20 13h2"/></svg>
      </div>
      <span>Finance Assistant</span>
    </div>
    <div class="topbar-actions">
      <button class="btn-ghost" id="newChatBtn" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
        New chat
      </button>
    </div>
  </header>

  <!-- LANDING -->
  <section id="landing">
    <div class="landing-inner">
      <div class="hero-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="8" width="16" height="12" rx="3"/><path d="M12 8V4"/><circle cx="12" cy="3" r="1" fill="currentColor"/><circle cx="9" cy="14" r="1.3" fill="currentColor"/><circle cx="15" cy="14" r="1.3" fill="currentColor"/><path d="M2 13h2M20 13h2"/></svg>
      </div>
      <h1>How can I help you today?</h1>
      <p class="sub">Pick a category to see common questions, or ask anything in your own words.</p>
      <div class="cat-grid" id="catGrid">
        <div class="landing-loading">Loading categories…</div>
      </div>
      <div class="landing-ask">
        <form id="landingAskForm">
          <input id="landingAskInput" type="text" placeholder="Ask a finance question…" autocomplete="off">
          <button type="submit">Ask</button>
        </form>
      </div>
    </div>
  </section>

  <!-- CHAT -->
  <section id="chatView" hidden>
    <div id="questionsPanel" hidden>
      <div class="qp-head">
        <span class="qp-title" id="qpTitle">Suggested questions</span>
        <button class="qp-close" id="qpClose" title="Hide">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <div class="qp-list" id="qpList"></div>
    </div>

    <div id="messages"><div class="messages-inner" id="messagesInner"></div></div>

    <div id="composer-wrap">
      <div class="composer-inner">
        <div id="suggestions" hidden></div>
        <div class="composer-box">
          <textarea id="chatInput" rows="1" placeholder="Ask a follow-up question…"></textarea>
          <button id="sendBtn" title="Send">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4 20-7Z"/></svg>
          </button>
        </div>
        <div class="composer-hint">Answers are generated and may be inaccurate — verify important figures.</div>
      </div>
    </div>
  </section>

</div>

<script>
(() => {
  const API = {
    categories: '/api/categories',
    catQuestions: (c) => `/api/categories/${encodeURIComponent(c)}/questions`,
    suggestions: (q) => `/api/suggestions?q=${encodeURIComponent(q)}`,
    session: '/api/session',
    ask: '/api/ask',
    feedback: '/api/feedback'
  };

  const state = {
    conversationId: null,
    currentCategory: null,
    activeSuggestionIndex: -1,
    suggestionItems: []
  };

  const el = (sel) => document.querySelector(sel);
  const landing = el('#landing');
  const chatView = el('#chatView');
  const catGrid = el('#catGrid');
  const questionsPanel = el('#questionsPanel');
  const qpList = el('#qpList');
  const qpTitle = el('#qpTitle');
  const messagesInner = el('#messagesInner');
  const messagesWrap = el('#messages');
  const chatInput = el('#chatInput');
  const sendBtn = el('#sendBtn');
  const suggestionsBox = el('#suggestions');
  const newChatBtn = el('#newChatBtn');
  const landingAskForm = el('#landingAskForm');
  const landingAskInput = el('#landingAskInput');

  const CAT_COLORS = ['#6c5ce7','#5a49d6','#8b7bf0','#4b3fc4'];
  const catColor = (name) => {
    let h = 0;
    for (let i = 0; i < name.length; i++) h = name.charCodeAt(i) + ((h << 5) - h);
    return CAT_COLORS[Math.abs(h) % CAT_COLORS.length];
  };

  function escapeHtml(str){
    return String(str).replace(/[&<>"']/g, (m) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  }

  // ---------- Session ----------
  async function startSession(){
    try{
      const res = await fetch(API.session, {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({})
      });
      const data = await res.json();
      state.conversationId = data.conversation_id || 'default_thread';
    }catch(e){
      state.conversationId = 'default_thread';
    }
  }

  // ---------- Categories ----------
  async function loadCategories(){
    try{
      const res = await fetch(API.categories);
      const cats = await res.json();
      renderCategories(cats);
    }catch(e){
      catGrid.innerHTML = '<div class="landing-empty">Couldn\'t load categories. You can still ask a question below.</div>';
    }
  }

  function renderCategories(cats){
    if(!cats || !cats.length){
      catGrid.innerHTML = '<div class="landing-empty">No categories yet — ask a question below to get started.</div>';
      return;
    }
    catGrid.innerHTML = '';
    cats.forEach(c => {
      const name = c.category;
      const card = document.createElement('div');
      card.className = 'cat-card';
      card.innerHTML = `
        <div class="cat-badge" style="background:${hexToSoft(catColor(name))};color:${catColor(name)}">${escapeHtml(name.charAt(0).toUpperCase())}</div>
        <div>
          <div class="cat-name">${escapeHtml(name)}</div>
          <div class="cat-count">${c.count} question${c.count === 1 ? '' : 's'}</div>
        </div>`;
      card.addEventListener('click', () => selectCategory(name));
      catGrid.appendChild(card);
    });
  }

  function hexToSoft(hex){
    return 'color-mix(in srgb, ' + hex + ' 14%, white)';
  }

  async function selectCategory(name){
    state.currentCategory = name;
    landing.hidden = true;
    chatView.hidden = false;
    newChatBtn.hidden = false;

    qpTitle.textContent = `Suggested questions · ${name}`;
    qpList.innerHTML = '<div class="qp-chip" style="cursor:default;">Loading…</div>';
    questionsPanel.hidden = false;

    if(!messagesInner.children.length){
      messagesInner.innerHTML = `<div class="empty-state">Pick a question below, or type your own to start the conversation.</div>`;
    }

    try{
      const res = await fetch(API.catQuestions(name));
      const questions = await res.json();
      renderQuestionChips(questions);
    }catch(e){
      qpList.innerHTML = '<div class="qp-chip" style="cursor:default;">Couldn\'t load questions.</div>';
    }
  }

  function renderQuestionChips(questions){
    if(!questions || !questions.length){
      qpList.innerHTML = '<div class="qp-chip" style="cursor:default;">No predefined questions in this category.</div>';
      return;
    }
    qpList.innerHTML = '';
    questions.forEach(q => {
      const text = typeof q === 'string' ? q : (q.question || '');
      if(!text) return;
      const chip = document.createElement('div');
      chip.className = 'qp-chip';
      chip.textContent = text;
      chip.addEventListener('click', () => {
        const emptyState = messagesInner.querySelector('.empty-state');
        if(emptyState) emptyState.remove();
        sendMessage(text);
      });
      qpList.appendChild(chip);
    });
  }

  newChatBtn.addEventListener('click', async () => {
    messagesInner.innerHTML = '';
    questionsPanel.hidden = true;
    await startSession();
    chatView.hidden = true;
    landing.hidden = false;
  });

  el('#qpClose').addEventListener('click', () => { questionsPanel.hidden = true; });

  // ---------- Landing free-form ask ----------
  landingAskForm.addEventListener('submit', (e) => {
    e.preventDefault();
    const val = landingAskInput.value.trim();
    if(!val) return;
    landing.hidden = true;
    chatView.hidden = false;
    newChatBtn.hidden = false;
    questionsPanel.hidden = true;
    landingAskInput.value = '';
    sendMessage(val);
  });

  // ---------- Chat rendering ----------
  const BOT_ICON_SVG = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="8" width="16" height="12" rx="3"/><path d="M12 8V4"/><circle cx="12" cy="3" r="1" fill="currentColor"/><circle cx="9" cy="14" r="1.3" fill="currentColor"/><circle cx="15" cy="14" r="1.3" fill="currentColor"/><path d="M2 13h2M20 13h2"/></svg>`;

  function formatTime(){
    return new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
  }

  function scrollToBottom(){
    messagesWrap.scrollTop = messagesWrap.scrollHeight;
  }

  function addUserMessage(text){
    const row = document.createElement('div');
    row.className = 'msg-row user';
    const bubbleCol = document.createElement('div');
    bubbleCol.className = 'bubble-col';
    bubbleCol.innerHTML = `
      <div class="msg-name-row"><span class="msg-name">You</span><span class="msg-time">${formatTime()}</span></div>
      <div class="bubble"></div>`;
    bubbleCol.querySelector('.bubble').textContent = text;
    row.appendChild(bubbleCol);
    messagesInner.appendChild(row);
    scrollToBottom();
  }

  function addTypingIndicator(){
    const row = document.createElement('div');
    row.className = 'msg-row ai';
    row.id = 'typingRow';
    row.innerHTML = `
      <div class="avatar">${BOT_ICON_SVG}</div>
      <div class="bubble-col">
        <div class="msg-name-row"><span class="msg-name">Finance Assistant</span><span class="msg-time">${formatTime()}</span></div>
        <div class="bubble"><div class="typing"><span></span><span></span><span></span></div></div>
      </div>`;
    messagesInner.appendChild(row);
    scrollToBottom();
  }

  function removeTypingIndicator(){
    const t = document.getElementById('typingRow');
    if(t) t.remove();
  }

  function addAiMessage(data){
    const row = document.createElement('div');
    row.className = 'msg-row ai';
    const bubbleCol = document.createElement('div');
    bubbleCol.className = 'bubble-col';

    const nameRow = document.createElement('div');
    nameRow.className = 'msg-name-row';
    nameRow.innerHTML = `<span class="msg-name">Finance Assistant</span><span class="msg-time">${formatTime()}</span>`;
    bubbleCol.appendChild(nameRow);

    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.textContent = data.answer || 'Sorry, I couldn\'t generate an answer.';
    bubbleCol.appendChild(bubble);

    const sources = data.sources || [];
    if(sources.length){
      const srcRow = document.createElement('div');
      srcRow.className = 'sources-row';
      sources.forEach(s => {
        const filename = typeof s === 'string' ? s : (s.filename || s.file || s.name || '');
        const label = typeof s === 'string' ? s : (s.title || s.filename || s.name || 'Source');
        if(!filename) return;
        const a = document.createElement('a');
        a.className = 'source-chip';
        a.href = `/source/${encodeURIComponent(filename)}`;
        a.target = '_blank';
        a.rel = 'noopener';
        a.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg><span>${escapeHtml(label)}</span>`;
        srcRow.appendChild(a);
      });
      if(srcRow.children.length) bubbleCol.appendChild(srcRow);
    }

    const fbRow = buildFeedbackRow(data.message_id);
    bubbleCol.appendChild(fbRow);

    row.innerHTML = `<div class="avatar">${BOT_ICON_SVG}</div>`;
    row.appendChild(bubbleCol);
    messagesInner.appendChild(row);
    scrollToBottom();
  }

  function buildFeedbackRow(messageId){
    const wrap = document.createElement('div');
    wrap.className = 'feedback-row';

    const up = document.createElement('button');
    up.className = 'fb-btn';
    up.title = 'Good answer';
    up.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 10v12"/><path d="M15 5.88 14 10h5.83a2 2 0 0 1 1.92 2.56l-2.33 8A2 2 0 0 1 17.5 22H4a2 2 0 0 1-2-2v-8a2 2 0 0 1 2-2h2.76a2 2 0 0 0 1.79-1.11L12 2a3.13 3.13 0 0 1 3 3.88Z"/></svg>`;

    const down = document.createElement('button');
    down.className = 'fb-btn';
    down.title = 'Bad answer';
    down.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 14V2"/><path d="M9 18.12 10 14H4.17a2 2 0 0 1-1.92-2.56l2.33-8A2 2 0 0 1 6.5 2H20a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-2.76a2 2 0 0 0-1.79 1.11L12 22a3.13 3.13 0 0 1-3-3.88Z"/></svg>`;

    const commentBtn = document.createElement('button');
    commentBtn.className = 'fb-btn';
    commentBtn.title = 'Add a comment';
    commentBtn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>`;

    const note = document.createElement('span');
    note.className = 'fb-note';

    let rated = null;

    async function sendFeedback(payload){
      try{
        await fetch(API.feedback, {
          method: 'POST',
          headers: {'Content-Type':'application/json'},
          body: JSON.stringify(Object.assign({message_id: messageId}, payload))
        });
      }catch(e){ /* fail silently, feedback is best-effort */ }
    }

    up.addEventListener('click', () => {
      if(rated) return;
      rated = 'up';
      up.classList.add('active-up');
      up.disabled = true; down.disabled = true;
      note.textContent = 'Thanks for the feedback';
      sendFeedback({rating:'up'});
    });

    down.addEventListener('click', () => {
      if(rated) return;
      rated = 'down';
      down.classList.add('active-down');
      up.disabled = true; down.disabled = true;
      note.textContent = 'Thanks — noted';
      sendFeedback({rating:'down'});
    });

    commentBtn.addEventListener('click', () => {
      let box = wrap.parentElement.querySelector('.fb-comment-box');
      if(box){ box.remove(); return; }
      box = document.createElement('div');
      box.className = 'fb-comment-box';
      box.innerHTML = `<textarea placeholder="What went wrong or right?"></textarea><button>Send</button>`;
      box.querySelector('button').addEventListener('click', () => {
        const val = box.querySelector('textarea').value.trim();
        if(!val) return;
        sendFeedback({comment: val, rating: rated});
        box.innerHTML = '<span class="fb-note">Comment sent — thank you</span>';
        setTimeout(() => box.remove(), 1800);
      });
      wrap.parentElement.appendChild(box);
    });

    wrap.appendChild(up);
    wrap.appendChild(down);
    wrap.appendChild(commentBtn);
    wrap.appendChild(note);
    return wrap;
  }

  function addErrorMessage(text){
    const row = document.createElement('div');
    row.className = 'msg-row ai';
    row.innerHTML = `<div class="avatar">${BOT_ICON_SVG}</div><div class="bubble-col"><div class="msg-name-row"><span class="msg-name">Finance Assistant</span><span class="msg-time">${formatTime()}</span></div><div class="bubble">${escapeHtml(text)}</div></div>`;
    messagesInner.appendChild(row);
    scrollToBottom();
  }

  // ---------- Sending messages ----------
  async function sendMessage(text){
    text = (text || '').trim();
    if(!text) return;
    hideSuggestions();
    chatInput.value = '';
    autoGrow();

    const emptyState = messagesInner.querySelector('.empty-state');
    if(emptyState) emptyState.remove();

    addUserMessage(text);
    addTypingIndicator();
    sendBtn.disabled = true;

    try{
      const res = await fetch(API.ask, {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({question: text, conversation_id: state.conversationId})
      });
      const data = await res.json();
      removeTypingIndicator();
      addAiMessage(data);
    }catch(e){
      removeTypingIndicator();
      addErrorMessage('Something went wrong reaching the assistant. Please try again.');
    }finally{
      sendBtn.disabled = false;
    }
  }

  sendBtn.addEventListener('click', () => sendMessage(chatInput.value));

  chatInput.addEventListener('keydown', (e) => {
    if(!suggestionsBox.hidden && state.suggestionItems.length){
      if(e.key === 'ArrowDown'){ e.preventDefault(); moveSuggestion(1); return; }
      if(e.key === 'ArrowUp'){ e.preventDefault(); moveSuggestion(-1); return; }
      if(e.key === 'Escape'){ hideSuggestions(); return; }
      if(e.key === 'Enter' && state.activeSuggestionIndex >= 0){
        e.preventDefault();
        chooseSuggestion(state.suggestionItems[state.activeSuggestionIndex]);
        return;
      }
    }
    if(e.key === 'Enter' && !e.shiftKey){
      e.preventDefault();
      sendMessage(chatInput.value);
    }
  });

  function autoGrow(){
    chatInput.style.height = 'auto';
    chatInput.style.height = Math.min(chatInput.scrollHeight, 140) + 'px';
  }
  chatInput.addEventListener('input', autoGrow);

  // ---------- Autocomplete ----------
  let debounceTimer = null;
  chatInput.addEventListener('input', () => {
    const q = chatInput.value.trim();
    clearTimeout(debounceTimer);
    if(q.length < 2){ hideSuggestions(); return; }
    debounceTimer = setTimeout(() => fetchSuggestions(q), 220);
  });

  chatInput.addEventListener('blur', () => {
    setTimeout(() => hideSuggestions(), 150);
  });

  async function fetchSuggestions(q){
    try{
      const res = await fetch(API.suggestions(q));
      const items = await res.json();
      renderSuggestions(items);
    }catch(e){
      hideSuggestions();
    }
  }

  function renderSuggestions(items){
    const list = (items || []).map(i => typeof i === 'string' ? i : (i.question || '')).filter(Boolean);
    state.suggestionItems = list;
    state.activeSuggestionIndex = -1;
    if(!list.length){ hideSuggestions(); return; }
    suggestionsBox.innerHTML = '';
    list.forEach((text, idx) => {
      const item = document.createElement('div');
      item.className = 'sugg-item';
      item.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg><span></span>`;
      item.querySelector('span').textContent = text;
      item.addEventListener('mousedown', (e) => { e.preventDefault(); chooseSuggestion(text); });
      suggestionsBox.appendChild(item);
    });
    suggestionsBox.hidden = false;
  }

  function moveSuggestion(dir){
    const items = suggestionsBox.querySelectorAll('.sugg-item');
    if(!items.length) return;
    state.activeSuggestionIndex = (state.activeSuggestionIndex + dir + items.length) % items.length;
    items.forEach((it, i) => it.classList.toggle('active', i === state.activeSuggestionIndex));
    items[state.activeSuggestionIndex].scrollIntoView({block:'nearest'});
  }

  function chooseSuggestion(text){
    hideSuggestions();
    sendMessage(text);
  }

  function hideSuggestions(){
    suggestionsBox.hidden = true;
    suggestionsBox.innerHTML = '';
    state.suggestionItems = [];
    state.activeSuggestionIndex = -1;
  }

  document.addEventListener('click', (e) => {
    if(!suggestionsBox.contains(e.target) && e.target !== chatInput){
      hideSuggestions();
    }
  });

  // ---------- Init ----------
  (async function init(){
    await startSession();
    await loadCategories();
  })();
})();
</script>
</body>
</html>
